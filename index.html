<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research</title>
<style>
:root {
  --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --border: #d1d9e0;
  --head: #f6f8fa; --stripe: #fbfcfd; --link: #0969da; --accent: #cf222e;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --border: #3d444d;
    --head: #151b23; --stripe: #10151c; --link: #4493f8; --accent: #ff7b72;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
}
main { max-width: 1100px; margin: 0 auto; padding: 32px 16px 64px; }
h1 { font-size: 2em; margin: 0 0 .3em; line-height: 1.25; }
h2 { font-size: 1.6em; margin: 2em 0 .5em; padding-bottom: .3em; border-bottom: 2px solid var(--border); }
h3 { font-size: 1.2em; margin: 1.6em 0 .5em; }
h4, h5, h6 { margin: 1.4em 0 .4em; }
a { color: var(--link); text-decoration: none; overflow-wrap: anywhere; }
a:hover { text-decoration: underline; }
strong { font-weight: 650; }
code { font: .9em ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--head); padding: .1em .3em; border-radius: 4px; }
pre { background: var(--head); padding: 12px 16px; border-radius: 6px; overflow-x: auto; }
pre code { background: none; padding: 0; }
blockquote { margin: 1em 0; padding: 0 1em; color: var(--muted); border-left: 4px solid var(--border); }
hr { border: 0; border-top: 1px solid var(--border); margin: 2em 0; }
.table-wrap { overflow-x: auto; margin: 1em 0; border: 1px solid var(--border); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; font-size: .92em; }
th, td { padding: 8px 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
th { background: var(--head); position: sticky; top: 0; }
tbody tr:nth-child(even) { background: var(--stripe); }
tbody tr:last-child td { border-bottom: 0; }
td:first-child { white-space: nowrap; }
td strong:first-child { color: var(--accent); }
nav.toc { background: var(--head); border: 1px solid var(--border); border-radius: 6px; padding: 12px 20px; margin: 1.5em 0; }
nav.toc p { margin: 0 0 .3em; font-weight: 650; }
nav.toc ul { margin: 0; padding-left: 1.2em; }
nav.toc ul ul { padding-left: 1.2em; }
</style>
</head>
<body>
<main>
<h1 id="research">Research</h1>
<p>Recherchen von Tristan Behrens. Jede Seite nennt ihren Stand.</p>
<ul><li><a href="ki-versprechen/">KI-Versprechen von Regierungen: Deutschland, USA, China</a> (Stand: 2. November 2026). Was Regierungen bei KI versprochen haben, was daraus wurde, warum, und wie wahrscheinlich die offenen Vorhaben gelingen.</li></ul>
</main>
</body>
</html>
